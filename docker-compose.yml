services:
  db:
    image: postgres:16-alpine
    container_name: outgo-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: outgo_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - outgo_internal_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: outgo-api:latest
    container_name: outgo-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/outgo_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN}
      FIREBASE_ADMIN_PATH: /app/config/firebase-adminsdk.json
    volumes:
      - ./server/api/src/firebase-adminsdk.json:/app/config/firebase-adminsdk.json:ro
    networks:
      - outgo_internal_network

volumes:
  postgres_data:

networks:
  outgo_internal_network:
    driver: bridge